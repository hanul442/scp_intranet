name: build-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
      - name: index.html 이 src/ 와 data/ 기준 최신인지 확인
        run: python build.py --check
      - name: 인라인 스크립트 문법 확인
        run: node -e "const h=require('fs').readFileSync('index.html','utf8');new Function(h.match(/<script>([\s\S]*)<\/script>/)[1]);console.log('ok')"
